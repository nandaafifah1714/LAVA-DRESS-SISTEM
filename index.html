        <main class="main">
            <header class="topbar">
                <div>
                    <strong>LAVE Management System</strong>
                    <div class="muted" style="font-size:11px">Integrated Rental - Inventory - Accounting</div>
                </div>
                <div class="muted" id="currentUser">Memuat sesi...</div>
            </header>

            <div id="toast" class="toast"></div>

            <section class="page">
                <div class="page-title">
                    <div>
                        <h2>Dress & Persediaan</h2>
                        <p>Kelola model dress, stok per ukuran/warna, kondisi unit, dan riwayat pergerakannya.</p>
                    </div>
                    <div class="form-actions">
                        <button class="btn btn-light" id="manageDressCategoriesButton" type="button">Kelola Kategori</button>
                        <button class="btn btn-primary" id="addDressButton" type="button">+ Tambah Dress</button>
                    </div>
                </div>

                <div class="card table-card">
                    <div class="table-head">
                        <strong>Daftar Dress</strong>
                        <input class="search" id="dressSearch" placeholder="Cari kode atau nama dress...">
                    </div>

                    <div class="table-wrap">
                        <table>
                            <thead>
                                <tr>
                                    <th>Kode</th>
                                    <th>Dress</th>
                                    <th>Kategori</th>
                                    <th>Ukuran</th>
                                    <th>Warna</th>
                                    <th>Harga Beli</th>
                                    <th>Harga Sewa</th>
                                    <th>Status</th>
                                    <th>Kondisi</th>
                                    <th>Aksi</th>
                                </tr>
                            </thead>
                            <tbody id="dressRows"></tbody>
                        </table>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <div class="modal" id="dressModal">
        <div class="modal-box">
            <div class="modal-head">
                <h3 id="dressModalTitle">Tambah Dress</h3>
                <button class="close" type="button" data-close="dressModal">x</button>
            </div>

            <form id="dressForm">
                <input type="hidden" id="dressId">

                <div class="form-grid">
                    <div class="field">
                        <label>Kode Dress</label>
                        <input id="dressCode" readonly placeholder="Otomatis saat disimpan">
                    </div>
                    <div class="field">
                        <label>Nama Dress</label>
                        <input id="dressName" required maxlength="100">
                    </div>
                    <div class="field">
                        <label>Kategori Dress</label>
                        <select id="dressCategory" required></select>
                    </div>
                    <div class="field">
                        <label>Ukuran</label>
                        <input id="dressSize" required>
                    </div>
                    <div class="field">
                        <label>Warna</label>
                        <input id="dressColor">
                    </div>
                    <div class="field">
                        <label>Harga Beli</label>
                        <input id="dressPurchasePrice" type="number" min="0" value="0" required>
                    </div>
                    <div class="field">
                        <label>Harga Sewa</label>
                        <input id="dressRentalPrice" type="number" min="0" value="0" required>
                    </div>
                    <div class="field">
                        <label>Kondisi</label>
                        <select id="dressCondition">
                            <option>Good</option>
                            <option>Dirty</option>
                            <option>Minor Damage</option>
                            <option>Major Damage</option>
                        </select>
                    </div>
                    <div class="field">
                        <label>Status</label>
                        <select id="dressStatus">
                            <option>Available</option>
                            <option>Rented</option>
                            <option>Laundry</option>
                            <option>Repair</option>
                            <option>Not Available</option>
                        </select>
                    </div>
                    <div class="field">
                        <label>Foto URL</label>
                        <input id="dressPhoto" type="url">
                    </div>
                    <div class="field">
                        <label>Keterangan</label>
                        <textarea id="dressDescription" rows="3"></textarea>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="button" class="btn btn-light" data-close="dressModal">Batal</button>
                    <button type="submit" class="btn btn-primary">Simpan Dress</button>
                </div>
            </form>
        </div>
    </div>






  </template>
